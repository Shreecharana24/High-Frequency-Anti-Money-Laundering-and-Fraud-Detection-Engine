version: "3.9"

services:
  mysql:
    image: mysql:8.0
    container_name: aml-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: aml_bank_db
      MYSQL_USER: aml_user
      MYSQL_PASSWORD: aml_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./config/mysql.cnf:/etc/mysql/conf.d/mysql.cnf:ro
    command: --default-authentication-plugin=mysql_native_password

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: aml-clickhouse
    restart: unless-stopped
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./config/clickhouse_init.sql:/docker-entrypoint-initdb.d/01_clickhouse_init.sql:ro

  grafana:
    image: grafana/grafana:latest
    container_name: aml-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - mysql
      - clickhouse

volumes:
  mysql_data:
  clickhouse_data:
