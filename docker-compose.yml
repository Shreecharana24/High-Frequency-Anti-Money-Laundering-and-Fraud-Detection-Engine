services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: aml_bank_db
      MYSQL_USER: aml_user
      MYSQL_PASSWORD: aml_pass
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./scripts/01_schema_oltp.sql:/docker-entrypoint-initdb.d/01_schema_oltp.sql:ro
      - ./scripts/02_stored_procedures.sql:/docker-entrypoint-initdb.d/02_stored_procedures.sql:ro
      - ./scripts/03_triggers.sql:/docker-entrypoint-initdb.d/03_triggers.sql:ro
      - ./scripts/04_functions.sql:/docker-entrypoint-initdb.d/04_functions.sql:ro
      - ./scripts/05_views.sql:/docker-entrypoint-initdb.d/05_views.sql:ro
      - ./scripts/08_seed_data.sql:/docker-entrypoint-initdb.d/08_seed_data.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./config/clickhouse_users.xml:/etc/clickhouse-server/users.d/demo-user.xml:ro
      - ./config/clickhouse_init.sql:/docker-entrypoint-initdb.d/01_clickhouse_init.sql:ro
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  generator:
    build: .
    command: python scripts/generator.py --inject-fraud
    environment:
      MYSQL_HOST: mysql
      MYSQL_USER: aml_user
      MYSQL_PASSWORD: aml_pass
      MYSQL_DATABASE: aml_bank_db
    depends_on:
      mysql:
        condition: service_healthy

  detector:
    build: .
    command: python scripts/detector.py
    environment:
      MYSQL_HOST: mysql
      MYSQL_USER: aml_user
      MYSQL_PASSWORD: aml_pass
      MYSQL_DATABASE: aml_bank_db
      CLICKHOUSE_HOST: clickhouse
    depends_on:
      mysql:
        condition: service_healthy
      clickhouse:
        condition: service_healthy

volumes:
  mysql_data:
  clickhouse_data:
